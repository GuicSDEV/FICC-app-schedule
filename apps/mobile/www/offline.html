<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FICC Tênis</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
        background: #05103c;
        color: #f2f5fb;
        font:
          17px/1.5 -apple-system,
          system-ui,
          Roboto,
          sans-serif;
        text-align: center;
      }
      img {
        width: 96px;
        height: auto;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 0;
        max-width: 22rem;
        color: #b9c1dc;
      }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 999px;
        padding: 14px 28px;
        background: #c4f252;
        color: #05103c;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="emblem.png" alt="" />
    <h1>Sem conexão</h1>
    <p>Não foi possível abrir o FICC Tênis. Confira a internet do celular e tente de novo.</p>
    <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">
      Tentar de novo
    </button>
  </body>
</html>
