packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency install scripts unless they are allowed here.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

ignoredBuiltDependencies:
  - "@nestjs/core"
  # Jest watch mode only; prebuilt binaries ship as optional dependencies.
  - "@parcel/watcher"

# Supply chain: no git/tarball transitive deps, no provenance downgrades, and only releases that
# are at least a day old (time for a hijacked version to be pulled before we install it).
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Versions published without provenance after earlier ones had it (reviewed, not takeovers).
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "semver@6.3.1"
  # Published by an OutSystems (Capacitor) maintainer 15 min after the trusted-published 7.0.5;
  # still the latest 8.x months later. Approved by the product owner.
  - "@capacitor/haptics@8.0.2"
minimumReleaseAge: 1440

# Patched versions of vulnerable transitive dependencies (pnpm audit). Remove an entry once the
# parent package ships the fix itself.
overrides:
  # next → postcss (build time): GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849 and follow-ups
  postcss: ">=8.5.23"
  # prisma → @prisma/config → deepmerge-ts (CLI): GHSA-ggr8-5vv4-36mx
  deepmerge-ts: ">=8.0.0"
  # tsup → esbuild (build time): GHSA-g7r4-m6w7-qqqr
  esbuild: ">=0.28.1"
  # @nestjs/platform-express → express → body-parser (runtime): GHSA-27r3-jxmh-p828
  body-parser: ">=2.4.0"
  # @nestjs/platform-express → multer (runtime): GHSA-q7qp-rjg7-q26m
  multer: ">=2.5.0"
  # supertest → superagent → qs (tests): GHSA-6pq8-jhm2-2vcw
  qs: ">=6.16.1"
  # @nestjs/cli → ajv → fast-uri (build tool): GHSA-w74x-v6f9-j3xg and others
  fast-uri: ">=3.1.9 <4"

auditConfig:
  # No patched release exists upstream; both are dev/test-only (never in the running apps).
  ignoreGhsas:
    # @next/eslint-plugin-next → fast-glob → micromatch → braces (lint only)
    - GHSA-vfj7-8cjw-p6xm
    # jest → … → js-yaml → argparse → sprintf-js (tests only)
    - GHSA-hp3w-g68c-fv3c
    # @nestjs/cli → fork-ts-checker-webpack-plugin → deepmerge (build tool, no patched release)
    - GHSA-gcqx-w48m-w2h4
    # @nestjs/cli pins glob 13.0.6 (and its minimatch) exactly; build tool only, not in the
    # running API. Drop these once a @nestjs/cli release moves to glob >= 14.0.2.
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249
