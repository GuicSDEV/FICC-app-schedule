packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency install scripts unless they are allowed here.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

ignoredBuiltDependencies:
  - "@nestjs/core"
  # Jest watch mode only; prebuilt binaries ship as optional dependencies.
  - "@parcel/watcher"
